<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Führungen Admin · Gurktaler</title>
<style>
:root{--green:#1b3d1b;--green-lt:#3a6b3a;--gold:#b8891a;--cream:#f7f3ea;--cream-dk:#ece4d0;--border:#d5ccb8;--text:#1a1a1a;--muted:#555;--white:#fff;--red:#9e2c1c;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--text);font-size:14px;}
header{background:var(--green);padding:16px 32px;display:flex;align-items:center;gap:20px;}
header h1{color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
header span{color:rgba(255,255,255,.5);font-size:12px;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px;}
.stat{background:var(--white);border:1px solid var(--border);padding:16px 20px;}
.stat-v{font-size:28px;font-weight:800;color:var(--green);line-height:1;}
.stat-l{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.termin-block{background:var(--white);border:1px solid var(--border);margin-bottom:20px;}
.termin-head{background:var(--green);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.termin-head h2{color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;}
.termin-meta{display:flex;gap:16px;align-items:center;}
.badge{display:inline-block;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.badge-ok{background:rgba(255,255,255,.15);color:#fff;}
.badge-warn{background:#b8891a;color:#fff;}
.badge-voll{background:#9e2c1c;color:#fff;}
.btn-absage{background:transparent;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.8);padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.15s;}
.btn-absage:hover{background:rgba(255,255,255,.1);}
table{width:100%;border-collapse:collapse;}
th{padding:9px 14px;background:var(--cream);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);}
td{padding:9px 14px;border-bottom:1px solid var(--cream-dk);font-size:13px;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#faf7f0;}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;}
.kapbar{height:6px;background:var(--cream-dk);margin-top:8px;border-radius:3px;overflow:hidden;}
.kapbar-fill{height:100%;background:var(--green);border-radius:3px;transition:.3s;}
.kapbar-fill.warn{background:var(--gold);}
.kapbar-fill.voll{background:var(--red);}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--white);max-width:420px;width:90%;padding:28px;}
.modal h3{color:var(--green);font-size:16px;margin-bottom:16px;}
.modal label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.modal textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);font-family:inherit;font-size:13px;resize:vertical;min-height:80px;outline:none;}
.modal textarea:focus{border-color:var(--green);}
.modal-btns{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
.btn{padding:9px 18px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:none;}
.btn-cancel{background:var(--cream-dk);color:var(--text);}
.btn-confirm{background:#9e2c1c;color:#fff;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:12px 20px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:200;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>Führungen Admin</h1>
  <span>Gurktaler Kräuterführungen · Saison 2026</span>
</header>

<div class="wrap">
  <div class="stats" id="stats">
    <div class="stat"><div class="stat-v" id="s-total">–</div><div class="stat-l">Buchungen gesamt</div></div>
    <div class="stat"><div class="stat-v" id="s-personen">–</div><div class="stat-l">Personen gesamt</div></div>
    <div class="stat"><div class="stat-v" id="s-umsatz">–</div><div class="stat-l">Erwarteter Umsatz</div></div>
    <div class="stat"><div class="stat-v" id="s-frei">–</div><div class="stat-l">Freie Plätze gesamt</div></div>
  </div>

  <div id="termine"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Termin absagen</h3>
    <p style="font-size:13px;color:#555;margin-bottom:16px;">Alle angemeldeten Gäste erhalten eine Absage-E-Mail.</p>
    <label>Termin</label>
    <p style="font-size:14px;font-weight:700;margin-bottom:14px;" id="modalTermin">–</p>
    <label>Grund (optional)</label>
    <textarea id="modalGrund" placeholder="Mindest-Teilnehmerzahl nicht erreicht."></textarea>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-confirm" onclick="doAbsage()">Absagen + E-Mails senden</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let pendingTerminId = null;

async function load() {
  try {
    const r = await fetch('/api/admin/buchungen');
    if (r.status === 401) { document.body.innerHTML = '<p style="padding:40px;font-size:16px;">Zugriff verweigert. Bitte neu laden und Passwort eingeben.</p>'; return; }
    const data = await r.json();
    renderStats(data);
    renderTermine(data.summary);
  } catch(e) {
    document.getElementById('termine').innerHTML = '<p style="padding:24px;color:#9e2c1c;">Fehler beim Laden: ' + e.message + '</p>';
  }
}

function renderStats(data) {
  const aktive = data.summary.flatMap(s => s.buchungen);
  document.getElementById('s-total').textContent = aktive.length;
  const pers = aktive.reduce((s,b)=>s+b.personen,0);
  document.getElementById('s-personen').textContent = pers;
  document.getElementById('s-umsatz').textContent = '€ ' + (pers * 15).toLocaleString('de-AT') + ',–';
  document.getElementById('s-frei').textContent = data.summary.reduce((s,t)=>s+t.freiePlaetze,0);
}

function renderTermine(summary) {
  const el = document.getElementById('termine');
  el.innerHTML = summary.map(s => {
    const pct = Math.round(s.gesamtPersonen / s.termin.kapazitaet * 100);
    const badgeCls = pct >= 100 ? 'badge-voll' : pct >= 70 ? 'badge-warn' : 'badge-ok';
    const badgeTxt = pct >= 100 ? 'Ausgebucht' : pct >= 70 ? 'Fast voll' : 'Plätze frei';
    const barCls = pct >= 100 ? 'voll' : pct >= 70 ? 'warn' : '';
    return `
    <div class="termin-block">
      <div class="termin-head">
        <h2>${s.termin.label} · ${s.termin.tag} · ${s.termin.uhrzeit} Uhr</h2>
        <div class="termin-meta">
          <span class="badge ${badgeCls}">${badgeTxt}</span>
          <span style="color:rgba(255,255,255,.7);font-size:12px;">${s.gesamtPersonen}/${s.termin.kapazitaet} Pers.</span>
          ${s.buchungen.length > 0 ? `<button class="btn-absage" onclick="openModal('${s.termin.id}','${s.termin.label} (${s.termin.tag}), ${s.termin.uhrzeit} Uhr')">Absagen</button>` : ''}
        </div>
      </div>
      <div style="padding:0 20px 4px;">
        <div class="kapbar"><div class="kapbar-fill ${barCls}" style="width:${pct}%;"></div></div>
      </div>
      ${s.buchungen.length === 0
        ? '<div class="empty">Noch keine Buchungen für diesen Termin.</div>'
        : `<table>
          <thead><tr><th>Buchungsnr.</th><th>Name</th><th>E-Mail</th><th>Telefon</th><th style="text-align:right;">Personen</th><th style="text-align:right;">Preis</th><th>Gebucht am</th></tr></thead>
          <tbody>${s.buchungen.map(b=>`
            <tr>
              <td style="font-family:monospace;font-size:12px;">${b.id}</td>
              <td style="font-weight:600;">${b.vorname} ${b.nachname}</td>
              <td><a href="mailto:${b.email}" style="color:var(--green);">${b.email}</a></td>
              <td>${b.telefon||'–'}</td>
              <td style="text-align:right;font-weight:700;">${b.personen}</td>
              <td style="text-align:right;">€ ${b.gesamtpreis},–</td>
              <td style="color:var(--muted);">${new Date(b.createdAt).toLocaleString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
            </tr>`).join('')}
          </tbody>
        </table>`}
    </div>`;
  }).join('');
}

function openModal(terminId, label) {
  pendingTerminId = terminId;
  document.getElementById('modalTermin').textContent = label;
  document.getElementById('modalGrund').value = '';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
  pendingTerminId = null;
}

async function doAbsage() {
  if (!pendingTerminId) return;
  const grund = document.getElementById('modalGrund').value.trim() || 'Mindest-Teilnehmerzahl von 10 Personen nicht erreicht.';
  closeModal();
  try {
    const r = await fetch('/api/admin/absage', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ terminId: pendingTerminId||document.getElementById('modalTermin').closest ? null : null, grund }) });
    // re-send with correct id
    const r2 = await fetch('/api/admin/absage', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ terminId: pendingTerminId, grund }) });
    const d = await r2.json();
    toast(`Absage gesendet · ${d.emailsGesendet} E-Mails · ${d.betroffenePersonen} Personen`);
    setTimeout(load, 500);
  } catch(e) { toast('Fehler: ' + e.message); }
}

// Fix: doAbsage had a duplicate fetch, rewrite cleanly
async function doAbsage() {
  if (!pendingTerminId) return;
  const tId = pendingTerminId;
  const grund = document.getElementById('modalGrund').value.trim() || 'Mindest-Teilnehmerzahl von 10 Personen nicht erreicht.';
  closeModal();
  try {
    const r = await fetch('/api/admin/absage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ terminId: tId, grund })
    });
    const d = await r.json();
    if (d.success) toast(`Absage gesendet · ${d.emailsGesendet} E-Mails · ${d.betroffenePersonen} Personen`);
    else toast('Fehler: ' + d.error);
    setTimeout(load, 600);
  } catch(e) { toast('Fehler: ' + e.message); }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

load();
setInterval(load, 30000); // Auto-refresh alle 30s
</script>
</body>
</html>
